# Configuração da Campanha Mínima Viável. Todos os parâmetros ficam só aqui, e cada réplica
# copia esses valores para o próprio metadado (rastreabilidade, Cap. 4).
campaign_id: mvc-2026-11-c3   # campanha 3, confirmatória (docs/PROTOCOLO_C3.md); campanhas 1 e 2 nas tags mvc-2026-11-final e mvc-2026-11-c2-final
seed: 20261115                 # semente da randomização da ordem dos braços (nova na campanha 3)
namespace: boutique
prometheus_url: http://localhost:9090   # via `make port-forward`

timing:                        # segundos
  warmup: 120                  # estabilização após o reset do ambiente
  baseline: 300                # janela de referência do estado estacionário (M_base)
  fault: 600                   # duração do incidente (igual nos dois braços)
  recovery: 600                # observação após o fim do incidente
  step: 5                      # período de avaliação, igual ao intervalo de coleta do Prometheus

replicas:
  per_cell: 10                 # réplicas por (cenário, braço)
  control: 20                  # réplicas de controle sem injeção (campanha 3: 20, limiar de 2 em 20)

analysis:
  false_block_max_rate: 0.1    # H1: taxa <= 0,1 (decisão de 2026-11-11, docs/PROTOCOLO.md Seção 8); na campanha 3, até 2 em 20
  # Regra de veredito (decisão D1 de 2026-11-12, docs/PROTOCOLO.md Seção 4). Mapa da Tabela 4.6 da v0.8.
  # favoravel: "menor" ou "maior" valor de MECADE menos baseline. Sem diferença pareada: tipo limiar.
  # `pendente` marca o que a Tabela 4.6 não fecha; essa componente não decide e a hipótese sai PENDENTE.
  veredito:
    alpha: 0.05                # nível do Holm (análise secundária)
    criterios:
      # Campanha 2 (docs/PROTOCOLO_C2.md, Tabela 4.7 da v0.9): o TTR decide a recuperação e o RTO é contado da
      # injeção (rto_ok_ttr). MTTR e classe tripartite passam a descritivos e saem do mapa de critérios.
      recuperacao:             # H2
        hipotese: H2
        componentes:
          - {metrica: TTR_capped, favoravel: menor}
          - {metrica: rto_ok_ttr, tipo: proporcao, favoravel: maior}   # McNemar exato, p < alpha
      deteccao_estabilidade:   # H1, Tabela 4.6 linha 3
        hipotese: H1
        componentes:
          - {metrica: TTD_capped, favoravel: menor}
          - {metrica: area_incidente, favoravel: menor}
          - {metrica: p95_std, favoravel: menor}
          - {metrica: p99_std, favoravel: menor}
      convergencia:            # H2, Tabela 4.6 linha 4
        hipotese: H2
        componentes:
          - {metrica: RRIndex_run, favoravel: maior}
      falsos_bloqueios:        # H1, Tabela 4.6 linha 5, sem diferença pareada (controles)
        hipotese: H1
        componentes:
          - {metrica: taxa_falsos_bloqueios, tipo: limiar, op: "<=", limiar_ref: false_block_max_rate}
      overhead_auditoria:      # H3, Tabela 4.6 linha 6, sem diferença pareada (controles com e sem auditoria)
        hipotese: H3
        componentes:
          - {metrica: delta_audit_p95_ms, tipo: limiar, op: "<=", limiar: 5}
          - {metrica: delta_cpu_pct, tipo: limiar, op: "<=", limiar: 8}

scenarios:                     # arquivos em scenarios/
  - s1_latencia_productcatalog
  - s2_gray_currency
  - s3_podkill_cart
control_scenario: c0_controle

# Sinais da Camada 2. {ns} e {target} são trocados em tempo de execução.
# floor é o piso do denominador de D(t), para métricas com baseline perto de zero (docs/PROTOCOLO.md, D2).
signals:
  p95:
    query: histogram_quantile(0.95, sum(rate(mecade_loadgen_request_duration_seconds_bucket[30s])) by (le))
    floor: 0.05
  p99:
    query: histogram_quantile(0.99, sum(rate(mecade_loadgen_request_duration_seconds_bucket[30s])) by (le))
    floor: 0.05
  error_rate:
    query: (sum(rate(mecade_loadgen_requests_total{outcome!="ok"}[30s])) or vector(0)) / sum(rate(mecade_loadgen_requests_total[30s]))
    floor: 0.01
# Sinais que só registro, sem entrar na decisão (servem para métricas derivadas).
aux_signals:
  throughput: sum(rate(mecade_loadgen_requests_total{outcome="ok"}[30s]))
  cpu_boutique: sum(rate(container_cpu_usage_seconds_total{namespace="{ns}",container!=""}[1m]))
  cpu_target: sum(rate(container_cpu_usage_seconds_total{namespace="{ns}",pod=~"{target}-.*",container!=""}[1m]))

# Parâmetros dos axiomas (Camada 3, Listagem 3.1). Ainda são valores iniciais; calibro na Fase 1.
axioms:
  decision_signals: [p95, p99, error_rate]   # n = 3
  k: 2                         # correlação multi-sinal: k de n
  # Valores da campanha 2 (tag mvc-2026-11-c2-calibracao). Na campanha 3 saem da Fase 1 (docs/PROTOCOLO_C3.md,
  # Seção 4) e são congelados aqui antes da primeira execução oficial; os pisos de p95 e p99 vão em signals.*.floor.
  d_on: 3.1                    # mesmo papel de delta_alert / epsilon (limiar de ativação)
  d_off: 2.9                   # limiar de desativação (histerese)
  tau_dwell: 15                # janela de confirmação (s)
  aggregation: max             # D_agr = max(D_m) ou média
  deadband: 2.9                # LIMIT integra max(0, D_agr - deadband) (ver docs/PROTOCOLO.md, D1)
  budget_B: 47.0               # Chaos Budget (unidades de D·s)
  limit_gate: alert            # campanha 3: o LIMIT só integra com ALERT ativo (D3 em mecade/axioms.py)
  envelope: d_on_tau           # classificação: degradado se D_agr > d_on por tau_dwell seguidos (campanha 2)
  envelope_delta: 1.0          # só vale com envelope: delta (campanha 1)

# Fase 1 da campanha 3 (docs/PROTOCOLO_C3.md, Seções 4 e 7). Regras fixadas antes dos dados.
calibracao:
  controles: 30                # campanha 3: 30 controles, no mínimo 27 válidos (limite 1/31 para um controle novo; PROTOCOLO_C3 Seção 7.1)
  pares_por_cenario: 3         # campanha 3: os 9 pilotos do braço baseline definem B; o braço MECADE só confere o pipeline
  regra_B: alerta_piloto       # campanha 3: pisos da mediana de M_base, LIMIT com ALERT, B dos pilotos (analysis/calibrate.py)
  tau_sem_solucao: 30          # se nenhum tau até 30 s zerar o ALERT espúrio, fica 30 s e a contagem é relatada

# Braço baseline: alerta convencional no estilo do Prometheus e runbook com atraso fixo.
reactive:
  rules:                       # dispara se qualquer regra ficar verdadeira por `for` segundos seguidos
    - {signal: p99, op: ">", factor_of_baseline: 2.0}
    - {signal: error_rate, op: ">", absolute: 0.05}
  for: 300                     # equivalente ao "for: 5m" usual
  response_delay: 120          # tempo para reconhecer o alerta e executar o runbook (s)

recovery:
  hold: 60                     # D_agr <= d_off por `hold` segundos conta como estado estacionário restaurado

block:
  stop_injection: false        # false: o incidente dura `fault` nos dois braços (é a análise principal)

audit:
  enabled: true                # perfil mínimo da Camada 6 (JSONL com hash encadeado, assíncrono)
  dir: data/audit
